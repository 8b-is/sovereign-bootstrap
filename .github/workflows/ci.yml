name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bootstrap-test:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          brew install rust go zig sccache
      - name: Run bootstrap (dry-run)
        run: |
          ./scripts/bootstrap.sh --dry-run 2>&1 | head -50
        env:
          WORKSPACE_ROOT: ${{ runner.temp }}/forge-workspace
          SCCACHE_DIR: ${{ runner.temp }}/sccache
          SCCACHE_SIZE: 5G
      - name: Verify binaries
        run: |
          ls -la ~/.local/bin/
          g8t --version || true
          up --version || true
          ospop --version || true

  release:
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
EOF